<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>六合彩模擬器 | Mark Six Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display@5.1.0/600.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display@5.1.0/700.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap"
    />
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="jackpot-aura" class="jackpot-aura hidden" aria-hidden="true"></div>
    <canvas id="win-fx-canvas" class="win-fx-canvas" aria-hidden="true"></canvas>

    <div id="mobile-loading-screen" class="mobile-loading-screen" aria-live="polite" aria-label="載入中">
      <div class="mobile-loading-card">
        <div class="mobile-loading-balls" aria-hidden="true">
          <span class="loader-ball ball-red">01</span>
          <span class="loader-ball ball-blue">09</span>
          <span class="loader-ball ball-green">28</span>
        </div>
        <div class="mobile-loading-title">六合彩攪珠機模擬器</div>
        <div id="mobile-loading-text" class="mobile-loading-text">正在準備模擬器...</div>
        <div class="mobile-loading-bar-track">
          <div id="mobile-loading-bar" class="mobile-loading-bar-fill"></div>
        </div>
        <div id="mobile-loading-pct" class="mobile-loading-pct">0%</div>
      </div>
    </div>

    <div id="host-speech-layer" class="host-speech-layer" aria-live="polite">
      <div id="host-bubble-male" class="host-speech-bubble hidden">今次又唔中喎</div>
      <div id="host-bubble-female" class="host-speech-bubble hidden">真係好可惜</div>
    </div>

    <div id="broadcast-hud">
      <!-- Top Minimal Header -->
      <header id="tv-header">
        <div class="header-left">
          <div class="brand-pill">
            <div class="brand-emblem" aria-hidden="true">
              <span class="brand-dot dot-red"></span>
              <span class="brand-dot dot-blue"></span>
              <span class="brand-dot dot-green"></span>
            </div>
            <div class="brand-text">
              <h1 class="brand-zh">Mark Six</h1>
              <span class="brand-sub">六合彩模擬器 · SIMULATOR</span>
            </div>
          </div>
        </div>
        <div class="header-right">
          <div class="status-pill">
            <span class="status-dot" aria-hidden="true"></span>
            <div id="phase-badge" class="phase-badge">準備就緒 · 49 粒號碼球已就位</div>
            <span class="pill-divider" aria-hidden="true"></span>
            <div id="live-clock" class="clock-box">21:30:00</div>
          </div>
        </div>
      </header>

      <!-- Top-Center Celebratory Win Banner (shown on prize win, Jackpot extra festive) -->
      <div id="win-banner" class="win-banner hidden" role="status" aria-live="polite">
        <span id="win-banner-icon" class="win-banner-icon" aria-hidden="true">🎉</span>
        <div class="win-banner-text">
          <div id="win-banner-title" class="win-banner-title">恭喜中獎！</div>
          <div id="win-banner-sub" class="win-banner-sub">已核對本局攪珠號碼</div>
        </div>
        <button id="btn-close-win-banner" class="mini-btn mini-btn-close" type="button" aria-label="關閉中獎提示">✕</button>
      </div>

      <!-- Right-Side Vertical Draw History Column -->
      <aside id="history-rail" class="history-rail" aria-label="近期開彩記錄">
        <div class="history-rail-header">
          <div class="popover-title-wrap">
            <span class="popover-title">開彩記錄</span>
            <span id="history-count-badge" class="popover-badge">0 局</span>
          </div>
          <div class="popover-actions">
            <button id="btn-clear-history" class="mini-btn" type="button">清除</button>
            <button id="btn-toggle-history" class="mini-btn mini-btn-close" type="button" aria-label="收起或展開開彩記錄">−</button>
          </div>
        </div>
        <div id="history-list" class="history-list">
          <div class="history-empty">完成攪珠後自動記錄</div>
        </div>
      </aside>

      <!-- Clean Bottom Cluster: Unified Scoreboard Card + Slim Action/Camera Dock -->
      <section id="tv-lower-third">
        <div id="ticket-panel" class="floating-popover hidden" role="dialog" aria-label="自選號碼對獎">
          <div class="popover-header">
            <div class="popover-title-wrap">
              <span class="popover-title">自選 6 碼對獎</span>
              <span id="ticket-count-badge" class="popover-badge">0/6</span>
            </div>
            <div class="popover-actions">
              <button id="btn-quick-pick" class="mini-btn mini-btn-accent" type="button">機選一注</button>
              <button id="btn-clear-pick" class="mini-btn" type="button">清除</button>
              <button id="btn-close-ticket" class="mini-btn mini-btn-close" type="button" aria-label="關閉選號面板">✕</button>
            </div>
          </div>
          <div id="ticket-grid" class="ticket-grid"></div>
          <div id="ticket-eval-bar" class="popover-footer">請點選 6 個號碼或按「機選一注」</div>
        </div>

        <div id="hero-popup" class="hero-popup hidden">
          <div id="hero-ball-circle" class="hero-ball-circle">
            <span id="hero-ball-num">--</span>
          </div>
          <div class="hero-meta">
            <div id="hero-label" class="hero-label">正在升起號碼球...</div>
          </div>
        </div>

        <!-- Single Unified Compact Scoreboard Card (My Pick strip cleanly paired above Pure Drawn Results) -->
        <div class="scoreboard-card">
          <div class="scoreboard-top">
            <button id="btn-open-ticket" class="ticket-cta-btn" type="button">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 8v8" />
                <path d="M8 12h8" />
              </svg>
              <span>自選號碼對獎</span>
            </button>
            <div id="ticket-selected-row" class="ticket-selected-row hidden">
              <span class="ticket-bar-zh">我的選號</span>
              <div id="ticket-picked-balls" class="picked-balls-row"></div>
              <span id="ticket-prize-pill" class="prize-pill hidden"></span>
              <div class="ticket-bar-actions">
                <button id="btn-edit-ticket" class="mini-btn mini-btn-accent" type="button">更改</button>
                <button id="btn-drop-ticket" class="mini-btn" type="button">清除</button>
              </div>
            </div>
          </div>

          <div class="scoreboard-divider" aria-hidden="true"></div>

          <div class="tv-results-bar">
            <div class="results-title">
              <span class="results-title-zh">攪珠結果</span>
              <span class="results-title-en">DRAWN NUMBERS</span>
            </div>
            <div class="slots-row">
              <div id="slot-0" class="ball-slot empty"><span>1</span></div>
              <div id="slot-1" class="ball-slot empty"><span>2</span></div>
              <div id="slot-2" class="ball-slot empty"><span>3</span></div>
              <div id="slot-3" class="ball-slot empty"><span>4</span></div>
              <div id="slot-4" class="ball-slot empty"><span>5</span></div>
              <div id="slot-5" class="ball-slot empty"><span>6</span></div>
              <div class="slot-plus">+</div>
              <div class="special-slot-wrap">
                <div id="slot-6" class="ball-slot special empty"><span>特</span></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Unified Floating Bottom Control Dock -->
      <footer id="bottom-dock">
        <div class="dock-group dock-actions">
          <button id="btn-start" class="btn btn-primary" type="button">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8 5.14v14l11-7-11-7z" />
            </svg>
            <span>開始攪珠</span>
          </button>
          <button id="btn-reset" class="btn btn-secondary" type="button">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
              <path d="M3 3v5h5" />
            </svg>
            <span>重新裝球</span>
          </button>
          <span class="dock-sep" aria-hidden="true"></span>
          <button id="btn-speed" class="btn btn-toggle" type="button">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
            <span class="toggle-text">快抽</span>
            <span class="toggle-pill" id="speed-state">關</span>
          </button>
          <button id="btn-director" class="btn btn-toggle active" type="button">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
              <circle cx="12" cy="13" r="3" />
            </svg>
            <span class="toggle-text">自動導播</span>
            <span class="toggle-pill" id="director-state">開</span>
          </button>
          <button id="btn-audio" class="btn btn-toggle active" type="button">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
            </svg>
            <span class="toggle-text">音效</span>
            <span class="toggle-pill" id="audio-state">開</span>
          </button>
          <button id="btn-mobile-ticket" class="btn btn-secondary mobile-only-btn" type="button" aria-expanded="false">
            <span>選號</span>
            <span class="toggle-pill" id="mobile-ticket-badge">0/6</span>
          </button>
          <button id="btn-mobile-history" class="btn btn-secondary mobile-only-btn" type="button" aria-expanded="false">
            <span>記錄</span>
            <span class="toggle-pill" id="mobile-history-badge">0</span>
          </button>
          <button
            id="btn-mobile-drawer"
            class="btn btn-secondary mobile-only-btn"
            type="button"
            aria-expanded="false"
            aria-label="控制與攝影機視角"
            title="控制與攝影機視角"
          >
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="4" y1="21" x2="4" y2="14" />
              <line x1="4" y1="10" x2="4" y2="3" />
              <line x1="12" y1="21" x2="12" y2="12" />
              <line x1="12" y1="8" x2="12" y2="3" />
              <line x1="20" y1="21" x2="20" y2="16" />
              <line x1="20" y1="12" x2="20" y2="3" />
              <line x1="1" y1="14" x2="7" y2="14" />
              <line x1="9" y1="8" x2="15" y2="8" />
              <line x1="17" y1="16" x2="23" y2="16" />
            </svg>
          </button>
        </div>

        <div class="dock-group dock-cameras" role="tablist" aria-label="攝影機視角">
          <button class="btn-cam active" data-cam="main" type="button">
            正面全景
          </button>
          <button class="btn-cam" data-cam="topVortex" type="button">
            機頂俯瞰
          </button>
          <button class="btn-cam" data-cam="liftClose" type="button">
            中央導管特寫
          </button>
          <button class="btn-cam" data-cam="leftTrack" type="button">
            左邊軌道
          </button>
          <button class="btn-cam" data-cam="rightTrack" type="button">
            右邊軌道
          </button>
        </div>

        <div class="mobile-drawer-header">
          <span class="popover-title">控制與攝影機視角</span>
          <div class="mobile-drawer-meta">
            <a href="https://github.com/edmondyip/mark-six" target="_blank" rel="noopener noreferrer">GitHub</a>
            <button id="btn-close-mobile-drawer" class="mini-btn mini-btn-close" type="button" aria-label="關閉控制面板">✕</button>
          </div>
        </div>
      </footer>

      <aside id="disclaimer-note" class="disclaimer-note" aria-label="免責聲明與音樂出處">
        <span>僅供學術與技術研究，非官方或賭博用途</span>
        <span class="disclaimer-sep" aria-hidden="true">·</span>
        <span>音樂：<a href="https://www.youtube.com/watch?v=3oA9HL20tDo" target="_blank" rel="noopener noreferrer">Shocking Blue - Inkpot</a></span>
        <span class="disclaimer-sep" aria-hidden="true">·</span>
        <span>如有需要可<a href="https://github.com/edmondyip/mark-six/issues" target="_blank" rel="noopener noreferrer">聯繫移除</a></span>
      </aside>

      <a
        id="github-repo-link"
        class="github-repo-link"
        href="https://github.com/edmondyip/mark-six"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="前往 GitHub 儲存庫"
        title="查看 GitHub 專案頁"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"
          />
        </svg>
      </a>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
